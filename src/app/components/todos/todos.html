<hr style="margin-top: 30px;">
<div style="background: #eef5ff; padding: 20px; border-radius: 8px;">
  <h3>Write Data into C-Drive File</h3>
  
  <!-- 1. Wrap inputs inside an official [formGroup] tag linked to our TS file component -->
  <form [formGroup]="fileForm" (ngSubmit)="writeInputDataToFile()" style="margin-bottom: 15px;">
    
    <!-- 2. Connect fields using formControlName properties -->
    <input type="text" formControlName="nameInput" placeholder="Enter Full Name..." style="padding: 6px; width: 200px;" />
    <input type="email" formControlName="emailInput" placeholder="Enter Email..." style="padding: 6px; width: 200px; margin-left: 10px;" />
    
    <!-- 3. Clean click invocation with zero inline parameters -->
    <button type="submit" style="margin-left: 10px; background: #28a745; color: white; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
       Write into File
    </button>
  </form>

  <button type="button" (click)="readDataFromCDrive()" style="background: #007bff; color: white; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
     Load & Read File
  </button>

   @if (readDiskData().length > 0) {
    <h5 style="color: #007bff; margin-top: 15px;">Current File Contents On Disk:</h5>
    <ul style="background: white; padding: 15px; border-radius: 4px; border: 1px solid #ccc;">
      @for (user of readDiskData(); track user.id) {
        <!--  Updated row layout container box with a flex line layout -->
        <li style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0;">
          <span>User: <strong>{{ user.firstName }}</strong> — Email: {{ user.email }}</span>
          
          <!-- Clicking this triggers our new delete logic on this specific user timestamp ID -->
          <button type="button" (click)="deleteCustomUserFromFile(user.id)" style="background: #dc3545; color: white; border: 0; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 0.8rem;">
            Delete
          </button>
        </li>
      }
    </ul>
  }

</div>
